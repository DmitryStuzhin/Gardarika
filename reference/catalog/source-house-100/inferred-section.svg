  </g>
  <g fill="#252623" font-family="Arial, sans-serif" font-size="25">
    <text x="54" y="70" font-size="32" font-weight="700">LENTO 100 · ВОССТАНОВЛЕННЫЙ РАЗРЕЗ</text>
    <text x="55" y="108" fill="#7c7569">Не рабочая документация. Контроль формы для 3D-конструктора.</text>
