<header class="adm-top">
  <div class="adm-top-in">
    <a class="adm-brand" href="#/" aria-label="Каталог домов">
      <img src="/assets/brand/mark.svg" alt="" width="26" height="29">
      <span class="brand-mark">Vozdvizhen</span>
      <span class="adm-brand-sep" aria-hidden="true"></span>
      <span class="adm-brand-sub">Каталог</span>
    </a>
    <div class="adm-top-act" id="topAct" hidden>
      <p class="adm-status" id="status" aria-live="polite"></p>
      <button type="button" class="adm-save" id="save"><svg><use href="#a-check"/></svg><span>Сохранить на сайт</span></button>
      <div class="adm-menu-wrap">
        <button type="button" class="adm-ib adm-ib-dark" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="Ещё"><svg><use href="#a-more"/></svg></button>
        <div class="adm-menu" id="menu" hidden>
          <a href="/index.html#/catalog" target="_blank" rel="noopener"><svg><use href="#a-ext"/></svg>Открыть сайт</a>
          <button type="button" id="historyBtn"><svg><use href="#a-history"/></svg>История версий</button>
          <button type="button" id="logout"><svg><use href="#a-out"/></svg>Выйти</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="adm-main">
  <section class="adm-login" id="login" hidden>
    <div class="adm-login-card">
      <div class="adm-login-art" aria-hidden="true">
        <img src="/assets/img/birch-132.webp" alt="">
        <p>Дома, фото и описания<br>для каталога на сайте</p>
      </div>
      <form class="adm-login-form" id="loginForm">
        <span class="adm-login-ic"><svg><use href="#a-lock"/></svg></span>
        <h1>Вход в админку</h1>
        <p>Введите пароль, который выдал скрипт настройки сервера.</p>
        <label class="adm-field"><span>Пароль</span><input type="password" id="password" autocomplete="current-password" required></label>
        <p class="adm-err" id="loginErr" role="alert" hidden></p>
        <button class="btn btn-honey" type="submit">Войти</button>
      </form>
    </div>
  </section>

  <section id="list" hidden></section>
  <section id="editor" hidden></section>
</main>

<div class="adm-toast" id="toast" role="status" hidden></div>

<dialog class="adm-dialog" id="dialog">
  <form method="dialog">
    <h2 id="dlgTitle"></h2>
    <div id="dlgBody"></div>
    <div class="adm-dlg-act" id="dlgAct"></div>
  </form>
</dialog>

<input type="file" id="filePick" accept="image/jpeg,image/png,image/webp" hidden>
<script src="/assets/js/data.js?v=5"></script>
<script src="/assets/admin/admin.js?v=3"></script>
